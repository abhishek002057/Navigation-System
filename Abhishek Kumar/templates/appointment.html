<body>

<div class="header">
DrMeet Hospital
</div>

<div class="appointment">

<div class="left">

<img src="https://img.freepik.com/free-photo/doctor-with-stethoscope-hands-hospital-background_1423-1.jpg">

<h2>Book Your Appointment</h2>

<p>
Our experienced doctors are here to provide the best healthcare.
Fill in your details below and schedule your appointment easily.
</p>

</div>

<div class="right">

<h2>Appointment Form</h2>

<form id="appointmentForm">

<input
type="text"
id="name"
class="form-control"
placeholder="Full Name"
required>

<input
type="tel"
id="phone"
class="form-control"
placeholder="Phone Number"
required>

<input
type="date"
id="date"
class="form-control"
required>

<input
type="number"
id="age"
class="form-control"
placeholder="Age"
required>

<input
type="number"
id="weight"
class="form-control"
placeholder="Weight (kg)"
required>

<label for="department" style="font-size:18px; margin-bottom:8px; display:block;">
  
</label>

<select id="department" class="form-control" required>
    <option value="">-- Select Department --</option>
    <option value="Cardiology">Cardiology</option>
    <option value="Neurology">Neurology</option>
    <option value="Orthopedics">Orthopedics</option>
    <option value="Dermatology">Dermatology</option>
    <option value="Gastroenterology">Gastroenterology</option>
    <option value="ENT">ENT</option>
    <option value="General Medicine">General Medicine</option>
    <option value="Pediatrics">Pediatrics</option>
    <option value="Gynecology">Gynecology</option>
</select>

<button
type="submit"
class="btn btn-primary btn-book">

<i class="fa-solid fa-calendar-check"></i>
Book Appointment

</button>

</form>

<div id="tokenBox">

<div class="success">
✅ Your Token is Generated!
</div>

<p style="margin-top:15px;">TOKEN NUMBER</p>

<h1 id="tokenNumber"></h1>

<p id="todayDate"></p>

</div>

</div>

</div>

<div class="footer">
© 2026 DrMeet Hospital | All Rights Reserved
</div>

<script>
document.getElementById("appointmentForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        date: document.getElementById("date").value,
        age: document.getElementById("age").value,
        weight: document.getElementById("weight").value,
        department: document.getElementById("department").value
    };

    try {

        const response = await fetch(
            "/generate_token?tab_id={{ tab_id }}",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        console.log(result);

        if (result.success) {

            document.getElementById("tokenNumber").innerHTML =
                result.token;

            document.getElementById("todayDate").innerHTML =
                new Date().toLocaleString();

            document.getElementById("tokenBox").style.display =
                "block";

            // Go to Profile after 2 seconds
            setTimeout(() => {

                window.location.href =
                    "/profile?tab_id={{ tab_id }}";

            }, 2000);

        } else {

            alert(
                result.error ||
                "Appointment booking failed."
            );

        }

    } catch (err) {

        console.error(err);

        alert(
            "Something went wrong while booking the appointment!"
        );

    }

});
</script>
